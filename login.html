<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101317" />
    <title>Sign in · Route Atlas</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; min-height: 100vh; display: grid; place-items: center; color: #f4f1eb; background: radial-gradient(circle at 50% -20%, rgba(255,112,69,.18), transparent 42%), #0d1014; }
      main { width: min(420px, calc(100vw - 32px)); padding: 28px; border: 1px solid #303943; border-radius: 18px; background: rgba(21,25,31,.96); box-shadow: 0 28px 80px rgba(0,0,0,.38); }
      .brand { display: flex; align-items: center; gap: 11px; font-weight: 800; letter-spacing: -.04em; }
      .mark { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; gap: 2px; border: 1px solid #ff7045; border-radius: 8px; background: rgba(255,112,69,.16); transform: rotate(-5deg); }
      .mark i { width: 3px; height: 12px; border-radius: 4px; background: #ff7045; transform: rotate(25deg); }
      .mark i:nth-child(2) { height: 17px; }
      .mark i:nth-child(3) { height: 8px; }
      .eyebrow { margin: 30px 0 7px; color: #ff7045; text-transform: uppercase; letter-spacing: .14em; font: 700 10px/1 monospace; }
      h1 { margin: 0; font-size: 28px; letter-spacing: -.045em; }
      p { color: #9ba3ae; font-size: 13px; line-height: 1.55; }
      label { display: block; margin: 24px 0 7px; color: #c4cad1; font-size: 12px; }
      input { width: 100%; padding: 12px 13px; color: #f4f1eb; background: #1c222a; border: 1px solid #3a4652; border-radius: 8px; outline: none; font: inherit; }
      input:focus { border-color: #ff7045; box-shadow: 0 0 0 3px rgba(255,112,69,.14); }
      button { width: 100%; margin-top: 14px; padding: 12px 14px; border: 0; border-radius: 8px; background: #ff7045; color: #1a120e; cursor: pointer; font: 800 14px inherit; }
      button:disabled { cursor: wait; opacity: .7; }
      .status { min-height: 20px; margin: 14px 0 0; color: #4fc59b; font: 12px/1.4 monospace; }
      .status.error { color: #ff7045; }
      .foot { margin-top: 24px; color: #69727e; font-size: 11px; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span><span>Route Atlas</span></div>
      <div class="eyebrow">Private workspace</div>
      <h1>Sign in to continue</h1>
      <p>Enter the workspace password to use the route editor and video export tools.</p>
      <form id="login-form">
        <label for="password">Workspace password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus />
        <button id="submit" type="submit">Unlock Route Atlas</button>
        <div class="status" id="status" role="status" aria-live="polite"></div>
      </form>
      <div class="foot">Your session is protected by an HTTP-only cookie.</div>
    </main>
    <script>
      const form = document.querySelector('#login-form');
      const input = document.querySelector('#password');
      const button = document.querySelector('#submit');
      const status = document.querySelector('#status');
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        button.disabled = true;
        status.className = 'status';
        status.textContent = 'Checking password…';
        try {
          const response = await fetch('/api/auth/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ password: input.value }) });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(payload.error || 'Unable to sign in.');
          status.textContent = 'Signed in. Opening workspace…';
          location.replace('/');
        } catch (error) {
          status.className = 'status error';
          status.textContent = error.message || 'Unable to sign in.';
          input.select();
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
